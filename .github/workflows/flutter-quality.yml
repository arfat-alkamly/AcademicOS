name: Flutter quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Analyze, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK platform, NDK, and CMake
        run: |
          sdkmanager "platforms;android-28"
          sdkmanager "ndk;27.0.12077973"
          sdkmanager "cmake;3.22.1"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          sdkmanager --list_installed | grep -F 'platforms;android-28'
          sdkmanager --list_installed | grep -F 'ndk;27.0.12077973'
          sdkmanager --list_installed | grep -F 'cmake;3.22.1'

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Dart sources
        shell: bash
        run: |
          set +e
          dart analyze --format machine > flutter-analyze.machine.log 2>&1
          analyze_status=$?
          set -e
          ANALYZE_STATUS="$analyze_status" python3 - <<'PY'
          import os
          import sys

          analyze_status = int(os.environ["ANALYZE_STATUS"])
          with open("flutter-analyze.machine.log", encoding="utf-8") as report:
              diagnostics = [
                  line.rstrip()
                  for line in report
                  if "|" in line and line.split("|", 1)[0] in {"ERROR", "WARNING", "INFO"}
              ]

          errors = [line for line in diagnostics if line.startswith("ERROR|")]
          warnings = [line for line in diagnostics if line.startswith("WARNING|")]
          infos = [line for line in diagnostics if line.startswith("INFO|")]

          if not diagnostics and analyze_status != 0:
              print("Dart analyzer failed without structured diagnostics.")
              with open("flutter-analyze.machine.log", encoding="utf-8") as report:
                  print(report.read()[:4000])
              sys.exit(2)

          for error in errors:
              print(error)

          print(
              f"Analyzer summary: {len(errors)} errors, "
              f"{len(warnings)} warnings, {len(infos)} infos."
          )
          if errors:
              sys.exit(1)
          PY
          if [ "$analyze_status" -ne 0 ]; then
            echo "::warning::Analyzer reported warnings or infos; no analyzer errors were found."
          fi

      - name: Run tests
        run: flutter test --no-pub

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
