name: Flutter quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Analyze, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK platform, NDK, and CMake
        run: |
          sdkmanager "platforms;android-28"
          sdkmanager "ndk;27.0.12077973"
          sdkmanager "cmake;3.22.1"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          sdkmanager --list_installed | grep -F 'platforms;android-28'
          sdkmanager --list_installed | grep -F 'ndk;27.0.12077973'
          sdkmanager --list_installed | grep -F 'cmake;3.22.1'

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart sources
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub 2>&1 | tee flutter-analyze.log
          analyze_status=${PIPESTATUS[0]}
          set -e
          if grep -E '(^|[[:space:]])error[[:space:]]+-' flutter-analyze.log; then
            echo "Dart analyzer reported errors."
            exit 1
          fi
          if [ "$analyze_status" -ne 0 ]; then
            echo "::warning::Analyzer reported existing warnings or infos; no analyzer errors were found."
          fi

      - name: Run tests
        run: flutter test --no-pub

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
