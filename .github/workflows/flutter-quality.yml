name: Flutter quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Analyze, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK platform, NDK, and CMake
        run: |
          sdkmanager "platforms;android-28"
          sdkmanager "ndk;27.0.12077973"
          sdkmanager "cmake;3.22.1"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          sdkmanager --list_installed | grep -F 'platforms;android-28'
          sdkmanager --list_installed | grep -F 'ndk;27.0.12077973'
          sdkmanager --list_installed | grep -F 'cmake;3.22.1'

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Dart sources
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub --machine > flutter-analyze.json 2> flutter-analyze.stderr.log
          analyze_status=$?
          set -e
          python3 - <<'PY'
          import json
          import sys

          raw = open("flutter-analyze.json", encoding="utf-8").read()
          json_start = raw.find("{")
          if json_start < 0:
              print("Analyzer did not produce machine-readable JSON.")
              print(raw[:2000])
              sys.exit(2)

          try:
              result, _ = json.JSONDecoder().raw_decode(raw, json_start)
          except json.JSONDecodeError as error:
              print(f"Could not parse analyzer JSON: {error}")
              print(raw[:2000])
              sys.exit(2)

          diagnostics = result.get("diagnostics", [])
          errors = [item for item in diagnostics if item.get("severity") == "ERROR"]
          for item in errors:
              location = item.get("location", {})
              start = location.get("start", {})
              print(
                  f"ERROR {location.get('file', '<unknown>')}:"
                  f"{start.get('line', 0)}:{start.get('column', 0)} "
                  f"{item.get('code', '')}: {item.get('problemMessage', '')}"
              )

          print(
              f"Analyzer summary: {len(errors)} errors, "
              f"{sum(item.get('severity') == 'WARNING' for item in diagnostics)} warnings, "
              f"{sum(item.get('severity') == 'INFO' for item in diagnostics)} infos."
          )
          if errors:
              sys.exit(1)
          PY
          if [ "$analyze_status" -ne 0 ]; then
            echo "::warning::Analyzer reported warnings or infos; no analyzer errors were found."
          fi

      - name: Run tests
        run: flutter test --no-pub

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
